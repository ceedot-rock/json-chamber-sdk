[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "json-chamber"
version = "1.1.0"
description = "Chamber JSON sealing — φ-split keyword shares, 24h BSL eval, $99 unlock. Public optimizer (benefit_check, delta, group, dedup). TRU8 engine is separate ($1,900/project/year)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Business Source License 1.1" }
authors = [
  { name = "Slid Phi Labs", email = "corey@slidphilabs.com" }
]
keywords = ["chamber", "seal", "cloak", "json", "security", "bsl", "trial", "benefit_check"]
dependencies = [
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]
server = ["flask>=3.0", "stripe>=10.0"]

[project.urls]
Homepage = "https://www.slidphilabs.com/chamber"
Documentation = "https://www.slidphilabs.com/chamber"
Repository = "https://github.com/ceedot-rock/json-chamber-sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["json_chamber*"]
